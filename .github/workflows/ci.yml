name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Cache the Northwind fixture
        id: fixture
        uses: actions/cache@v4
        with:
          path: tests/fixtures/northwind-2.0-dev.accdt
          key: northwind-2.0-dev-accdt-v1
      - name: Fetch the Northwind fixture
        if: steps.fixture.outputs.cache-hit != 'true'
        shell: bash
        run: scripts/fetch-fixtures.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-features
      - name: Doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
